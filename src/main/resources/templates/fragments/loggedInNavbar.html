<!-- fragments/loggedInNavbar.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>
    <!-- Reusable Navbar Fragment -->
    <nav th:fragment="main-navbar(activeTab)"
        class="bg-black/80 backdrop-blur-md border-b border-violet-900/30 py-3.5 shadow-xl fixed w-full top-0 z-50">
        <div class="container mx-auto flex justify-between items-center px-6">
            <!-- Brand Logo -->
            <a href="/home" class="text-2xl font-black relative group flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-violet-600 to-indigo-500 flex items-center justify-center text-white text-sm shadow-md shadow-violet-500/20">
                    <i class="fas fa-compass"></i>
                </div>
                <span class="bg-gradient-to-r from-violet-400 via-purple-300 to-indigo-300 bg-clip-text text-transparent tracking-tight">
                    STC
                </span>
            </a>

            <!-- Desktop Navigation Links -->
            <div class="hidden md:flex items-center space-x-1">
                <a href="/home"
                    th:class="${activeTab == 'home'} ? 'text-violet-400 font-semibold px-4 py-2 text-sm border-b-2 border-violet-400' : 'text-gray-300 hover:text-violet-300 px-4 py-2 text-sm transition duration-300 relative group'">
                    <i class="fas fa-home mr-1.5 opacity-80"></i> Home
                </a>
                <a href="/user/dashboard"
                    th:class="${activeTab == 'dashboard'} ? 'text-violet-400 font-semibold px-4 py-2 text-sm border-b-2 border-violet-400' : 'text-gray-300 hover:text-violet-300 px-4 py-2 text-sm transition duration-300 relative group'">
                    <i class="fas fa-compass mr-1.5 opacity-80"></i> Explore
                </a>
                <a href="/user/travel/myplans"
                    th:class="${activeTab == 'myplans'} ? 'text-violet-400 font-semibold px-4 py-2 text-sm border-b-2 border-violet-400' : 'text-gray-300 hover:text-violet-300 px-4 py-2 text-sm transition duration-300 relative group'">
                    <i class="fas fa-map-marked-alt mr-1.5 opacity-80"></i> My Plans
                </a>
                <a href="/user/friends"
                    th:class="${activeTab == 'friends'} ? 'text-violet-400 font-semibold px-4 py-2 text-sm border-b-2 border-violet-400' : 'text-gray-300 hover:text-violet-300 px-4 py-2 text-sm transition duration-300 relative group'">
                    <i class="fas fa-users mr-1.5 opacity-80"></i> Friends
                </a>
                <a href="/user/community"
                    th:class="${activeTab == 'community'} ? 'text-violet-400 font-semibold px-4 py-2 text-sm border-b-2 border-violet-400' : 'text-gray-300 hover:text-violet-300 px-4 py-2 text-sm transition duration-300 relative group'">
                    <i class="fas fa-globe mr-1.5 opacity-80"></i> Community
                </a>
                <a href="/user/chat"
                    th:class="${activeTab == 'chat'} ? 'text-violet-400 font-semibold px-4 py-2 text-sm border-b-2 border-violet-400' : 'text-gray-300 hover:text-violet-300 px-4 py-2 text-sm transition duration-300 relative group'">
                    <i class="far fa-comments mr-1.5 opacity-80"></i> Messages
                </a>
                <a href="/user/profile"
                    th:class="${activeTab == 'profile'} ? 'text-violet-400 font-semibold px-4 py-2 text-sm border-b-2 border-violet-400' : 'text-gray-300 hover:text-violet-300 px-4 py-2 text-sm transition duration-300 relative group'">
                    <i class="far fa-user mr-1.5 opacity-80"></i> Profile
                </a>

                <!-- Logout Button -->
                <form th:action="@{/logout}" method="post" class="ml-4">
                    <button type="submit" class="text-xs font-bold text-gray-400 hover:text-red-400 px-3 py-1.5 rounded-lg border border-white/10 hover:border-red-500/30 hover:bg-red-500/10 transition duration-300 flex items-center gap-1.5">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </form>
            </div>

            <!-- Mobile Menu Toggle Button -->
            <button id="mobile-menu-button" class="md:hidden text-gray-300 focus:outline-none p-2 rounded-lg hover:bg-white/5">
                <i class="fas fa-bars text-lg"></i>
            </button>
        </div>

        <!-- Mobile Navigation Drawer -->
        <div id="mobile-menu" class="hidden md:hidden bg-black/95 border-b border-violet-900/30 px-6 py-4 space-y-3">
            <a href="/home" class="block text-gray-300 hover:text-violet-400 py-1 text-sm"><i class="fas fa-home w-6"></i> Home</a>
            <a href="/user/dashboard" class="block text-gray-300 hover:text-violet-400 py-1 text-sm"><i class="fas fa-compass w-6"></i> Explore</a>
            <a href="/user/travel/myplans" class="block text-gray-300 hover:text-violet-400 py-1 text-sm"><i class="fas fa-map-marked-alt w-6"></i> My Plans</a>
            <a href="/user/friends" class="block text-gray-300 hover:text-violet-400 py-1 text-sm"><i class="fas fa-users w-6"></i> Friends</a>
            <a href="/user/community" class="block text-gray-300 hover:text-violet-400 py-1 text-sm"><i class="fas fa-globe w-6"></i> Community</a>
            <a href="/user/chat" class="block text-gray-300 hover:text-violet-400 py-1 text-sm"><i class="far fa-comments w-6"></i> Messages</a>
            <a href="/user/profile" class="block text-gray-300 hover:text-violet-400 py-1 text-sm"><i class="far fa-user w-6"></i> Profile</a>
            <form th:action="@{/logout}" method="post" class="pt-2 border-t border-white/10">
                <button type="submit" class="text-red-400 text-sm font-semibold flex items-center gap-2">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </form>
        </div>
    </nav>

    <!-- JavaScript for Mobile Drawer Toggle -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');

            if (mobileMenuButton && mobileMenu) {
                mobileMenuButton.addEventListener('click', function () {
                    mobileMenu.classList.toggle('hidden');
                });
            }
        });
    </script>
</body>

</html>
