<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Solo Travel Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <style>
        .hero-bg {
            background: radial-gradient(circle at top right, #4c1d95 0%, #1e1b4b 50%, #000 100%);
            animation: gradientAnimation 15s ease infinite;
        }

        @keyframes gradientAnimation {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .login-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(139, 92, 246, 0.2);
        }

        .input-wrapper {
            position: relative;
            overflow: hidden;
        }

        .input-wrapper::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #8b5cf6, #6366f1);
            transition: 0.4s;
        }

        .input-wrapper:focus-within::after {
            left: 0;
        }

        .gradient-button {
            background-size: 200% auto;
            transition: 0.5s;
        }

        .gradient-button:hover {
            background-position: right center;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.35);
        }
    </style>
</head>

<body class="hero-bg min-h-screen flex flex-col text-white">
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar-guest('login')}"></div>

    <!-- Login Section -->
    <div class="flex-1 flex justify-center items-center px-4 py-20">
        <div class="login-card rounded-2xl p-8 md:p-10 w-full max-w-md" data-aos="fade-up">
            <div class="text-center mb-8">
                <h2
                    class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-violet-400 to-purple-500 bg-clip-text text-transparent mb-3">
                    Welcome Back!
                </h2>
                <p class="text-gray-400">Continue your journey with us</p>
            </div>

            <form data-th-action="@{'/login'}" data-th-object="${loginForm}" method="post" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-sm font-medium text-gray-300">Email</label>
                    <div
                        class="input-wrapper bg-gray-800/50 rounded-xl border border-gray-700 focus-within:border-violet-500 transition-colors duration-300">
                        <div class="flex items-center">
                            <span class="pl-4 text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path d="M4 4h16v16H4z"></path>
                                    <path d="M22 6L12 13 2 6"></path>
                                </svg>
                            </span>
                            <input type="email" th:field="*{email}" required
                                class="w-full p-4 bg-transparent focus:outline-none text-white placeholder-gray-500"
                                placeholder="Enter your email">
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-gray-300">Password</label>
                    <div
                        class="input-wrapper bg-gray-800/50 rounded-xl border border-gray-700 focus-within:border-violet-500 transition-colors duration-300">
                        <div class="flex items-center">
                            <span class="pl-4 text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 17v.01"></path>
                                    <path d="M19 11a7 7 0 1 0-14 0v4a3 3 0 0 0 6 0v-4"></path>
                                </svg>
                            </span>
                            <input type="password" th:field="*{password}" required
                                class="w-full p-4 bg-transparent focus:outline-none text-white placeholder-gray-500"
                                placeholder="Enter your password">
                        </div>
                    </div>
                </div>

                <button type="submit"
                    class="w-full gradient-button bg-gradient-to-r from-violet-600 via-purple-600 to-violet-600 text-white font-medium py-4 rounded-xl transition-all duration-300">
                    Sign In
                </button>
            </form>

            <div class="mt-6 text-center space-y-4">
                <a href="#" class="text-sm text-violet-400 hover:text-violet-300 transition-colors duration-300">
                    Forgot your password?
                </a>
                <p class="text-gray-400">
                    New to STC?
                    <a href="/register" class="text-violet-400 hover:text-violet-300 transition-colors duration-300">
                        Create an account
                    </a>
                </p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-black/50 backdrop-blur-md py-6 text-center">
        <p class="text-gray-400">&copy; 2025 Solo Travel Companion. All rights reserved.</p>
    </footer>

    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>
</body>

</html>
