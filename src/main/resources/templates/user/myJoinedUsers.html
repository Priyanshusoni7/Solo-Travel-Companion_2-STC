<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Travel Companions - Solo Travel Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <style>
        .glass-effect {
            background: rgba(20, 20, 40, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 20px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-effect:hover {
            transform: translateY(-5px);
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 15px 30px rgba(139, 92, 246, 0.15);
        }

        .hero-bg {
            background: radial-gradient(circle at top, #2e1065 0%, #0f051d 50%, #030008 100%);
            background-attachment: fixed;
        }

        .gradient-text {
            background: linear-gradient(135deg, #a855f7 0%, #8b5cf6 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="bg-black text-white min-h-screen flex flex-col mt-8 hero-bg">
    <!-- Navbar -->
    <div th:replace="~{fragments/loggedInNavbar :: main-navbar('myplans')}"></div>

    <!-- Main Content -->
    <main class="flex-grow py-16 px-4">
        <div class="container mx-auto max-w-6xl">
            <h1 class="text-4xl font-bold gradient-text mb-8" data-aos="fade-up">Manage Travel</h1>

            <!-- Flex Grid with Sidebar -->
            <div class="flex flex-col md:flex-row gap-8">
                
                <!-- Left Sidebar Navigation -->
                <div class="w-full md:w-64 flex-shrink-0" data-aos="fade-up">
                    <div class="glass-effect p-6 sticky top-24 space-y-2">
                        <h3 class="text-xs font-bold tracking-wider text-violet-400 uppercase mb-4 px-2">Navigation</h3>
                        
                        <a href="/user/travel/myplans" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 text-gray-300 transition">
                            <i class="fas fa-map-marked-alt text-violet-400 w-5"></i> My Plans
                        </a>
                        
                        <a href="/user/travel/post" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 text-gray-300 transition">
                            <i class="fas fa-plus-circle text-violet-400 w-5"></i> Post New Plan
                        </a>
                        
                        <a href="/user/travel/my-joined-users" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-violet-600/20 text-violet-300 font-semibold border-l-2 border-violet-500 transition">
                            <i class="fas fa-users-cog text-violet-400 w-5"></i> Joined Companions
                        </a>
                        
                        <a href="/user/requests/pending" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 text-gray-300 transition">
                            <i class="fas fa-envelope-open-text text-violet-400 w-5"></i> Pending Requests
                        </a>
                        
                        <a href="/user/requests/sent" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 text-gray-300 transition">
                            <i class="fas fa-paper-plane text-violet-400 w-5"></i> Sent Requests
                        </a>
                    </div>
                </div>

                <!-- Right Side content area -->
                <div class="flex-grow" data-aos="fade-up" data-aos-delay="100">
                    
                    <!-- Empty State -->
                    <div th:if="${planJoinedUsers.isEmpty()}" class="glass-effect p-10 text-center text-gray-400">
                        <i class="fas fa-user-friends text-violet-400 text-4xl mb-4 opacity-50"></i>
                        <p class="text-lg text-gray-300">No companions have joined any of your plans yet.</p>
                    </div>

                    <!-- Travel Plans with Joined Companions -->
                    <div th:unless="${planJoinedUsers.isEmpty()}" class="space-y-6">
                        <div th:each="entry : ${planJoinedUsers}" class="glass-effect p-6">
                            
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h2 class="text-xl font-bold text-white" th:text="${entry.key.destination}">Destination</h2>
                                    <p class="text-xs text-violet-300 flex items-center gap-1.5 mt-1">
                                        <i class="fas fa-calendar-alt text-violet-400"></i>
                                        <span th:text="${#dates.format(entry.key.startDate, 'MMM dd')}"></span> -
                                        <span th:text="${#dates.format(entry.key.endDate, 'MMM dd, yyyy')}"></span>
                                    </p>
                                </div>
                                <span class="px-2.5 py-1 rounded-full bg-green-500/10 border border-green-500/20 text-green-400 text-[10px] font-bold tracking-wider"
                                      th:text="${entry.key.planStatus}">OPEN</span>
                            </div>

                            <!-- Joined Users Grid -->
                            <div class="mt-6 border-t border-white/5 pt-4">
                                <h3 class="text-xs font-bold text-violet-400 uppercase tracking-widest mb-3 flex items-center gap-1.5">
                                    <i class="fas fa-users text-sm"></i>
                                    Joined Travelers (<span th:text="${entry.value.size()}">0</span>)
                                </h3>

                                <div th:if="${entry.value.isEmpty()}" class="text-gray-500 text-xs italic py-2">
                                    No travel companions have joined this trip plan.
                                </div>

                                <div th:unless="${entry.value.isEmpty()}" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div th:each="user : ${entry.value}" class="flex items-center justify-between p-3 bg-white/5 rounded-xl border border-white/5">
                                        <div class="flex items-center min-w-0">
                                            <img th:src="${user.profilePic != null ? user.profilePic : '/images/userimg.png'}"
                                                 class="w-9 h-9 rounded-full object-cover border border-violet-500/30 mr-3" alt="Avatar">
                                            <div class="min-w-0">
                                                <h4 class="font-bold text-xs truncate text-white" th:text="${user.name}">Username</h4>
                                                <p class="text-[10px] text-gray-400 truncate" th:text="${user.email}">user@email.com</p>
                                            </div>
                                        </div>
                                        <!-- FIXED: Message icon directly opens chat with this preselected friend companion -->
                                        <a th:href="@{/user/chat(userId=${user.userId})}"
                                           class="w-8 h-8 rounded-full bg-violet-600/20 hover:bg-violet-600/40 text-violet-400 flex items-center justify-center transition duration-300">
                                            <i class="far fa-comment-dots text-sm"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>

            </div>

        </div>
    </main>

    <script>
        AOS.init({
            duration: 800,
            once: true
        });
    </script>
</body>

</html>
