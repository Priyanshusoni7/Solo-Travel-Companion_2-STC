<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Travel Plan - Solo Travel Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
    <style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            transition: all 0.4s ease;
        }

        .glass-effect:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(139, 92, 246, 0.3);
        }

        .hero-bg {
            background: radial-gradient(circle at top right, #4c1d95 0%, #1e1b4b 50%, #0f0f1a 100%);
            background-attachment: fixed;
        }

        .gradient-text {
            background: linear-gradient(135deg, #a855f7 0%, #8b5cf6 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hover-glow {
            transition: all 0.3s ease;
        }

        .hover-glow:hover {
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.6);
            transform: translateY(-3px);
        }

        .form-control {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            color: white;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: rgba(139, 92, 246, 0.6);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.25);
            outline: none;
        }

        .form-label {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            margin-bottom: 0.5rem;
            display: block;
        }

        .day-card {
            transition: all 0.3s ease;
        }

        .day-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
        }

        .input-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body class="bg-black text-white min-h-screen flex flex-col mt-8">
    <!-- Navbar -->
    <div th:replace="~{fragments/loggedInNavbar :: main-navbar('myplans')}"></div>

    <!-- Main Content -->
    <main class="hero-bg flex-grow py-16 px-4">
        <div class="container mx-auto max-w-4xl">
            <h1 class="text-4xl font-bold gradient-text mb-8" data-aos="fade-up">Edit Your Adventure</h1>

            <form th:action="@{/user/travel/update/{id}(id=${travelPlan.travelId})}" method="post" class="space-y-8">
                <!-- Main plan details section -->
                <div class="glass-effect p-8" data-aos="fade-up">
                    <div class="space-y-6">
                        <!-- Destination -->
                        <div>
                            <label for="destination" class="form-label">Destination <span
                                    class="text-violet-500">*</span></label>
                            <div class="relative">
                                <input type="text" id="destination" name="destination"
                                    th:value="${travelPlan.destination}" class="form-control w-full" required>
                                <span class="input-icon"><i class="fas fa-map-marker-alt"></i></span>
                            </div>
                        </div>

                        <!-- Dates -->
                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <label for="startDate" class="form-label">Start Date <span
                                        class="text-violet-500">*</span></label>
                                <div class="relative">
                                    <input type="text" id="startDate" name="startDate"
                                        th:value="${#dates.format(travelPlan.startDate, 'yyyy-MM-dd')}"
                                        class="form-control w-full" required>
                                    <span class="input-icon"><i class="fas fa-calendar-alt"></i></span>
                                </div>
                            </div>
                            <div>
                                <label for="endDate" class="form-label">End Date <span
                                        class="text-violet-500">*</span></label>
                                <div class="relative">
                                    <input type="text" id="endDate" name="endDate"
                                        th:value="${#dates.format(travelPlan.endDate, 'yyyy-MM-dd')}"
                                        class="form-control w-full" required>
                                    <span class="input-icon"><i class="fas fa-calendar-alt"></i></span>
                                </div>
                            </div>
                        </div>

                        <!-- Interest and status -->
                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <label for="interest" class="form-label">Interest <span
                                        class="text-violet-500">*</span></label>
                                <div class="relative">
                                    <select id="interest" name="interest" class="form-control w-full" required>
                                        <option value="">Select an interest</option>
                                        <option value="Adventure" th:selected="${travelPlan.interest == 'Adventure'}">
                                            Adventure</option>
                                        <option value="Relaxation" th:selected="${travelPlan.interest == 'Relaxation'}">
                                            Relaxation</option>
                                        <option value="Culture" th:selected="${travelPlan.interest == 'Culture'}">
                                            Culture</option>
                                        <option value="Food & Cuisine"
                                            th:selected="${travelPlan.interest == 'Food & Cuisine'}">Food & Cuisine
                                        </option>
                                        <option value="Nature" th:selected="${travelPlan.interest == 'Nature'}">Nature
                                        </option>
                                        <option value="Photography"
                                            th:selected="${travelPlan.interest == 'Photography'}">Photography</option>
                                        <option value="History" th:selected="${travelPlan.interest == 'History'}">
                                            History</option>
                                        <option value="Shopping" th:selected="${travelPlan.interest == 'Shopping'}">
                                            Shopping</option>
                                    </select>
                                    <span class="input-icon"><i class="fas fa-tag"></i></span>
                                </div>
                            </div>
                            <div>
                                <label for="planStatus" class="form-label">Plan Status <span
                                        class="text-violet-500">*</span></label>
                                <div class="relative">
                                    <select id="planStatus" name="planStatus" class="form-control w-full" required>
                                        <option value="OPEN" th:selected="${travelPlan.planStatus == 'OPEN'}">OPEN
                                        </option>
                                        <option value="CLOSED" th:selected="${travelPlan.planStatus == 'CLOSED'}">CLOSED
                                        </option>
                                    </select>
                                    <span class="input-icon"><i class="fas fa-chart-line"></i></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Day-by-day itinerary section -->
                <div class="glass-effect p-8" data-aos="fade-up" data-aos-delay="100">
                    <h2 class="text-2xl font-bold mb-6">Day-by-Day Itinerary</h2>

                    <div id="days-container" class="space-y-6">
                        <!-- Dynamically generate day cards based on the map entries -->
                        <div th:each="day, status : ${travelPlan.dayItineraries}"
                            class="day-card glass-effect p-6 relative">
                            <h3 class="text-lg font-semibold mb-3">
                                Day <span th:text="${day.key}"></span>
                            </h3>
                            <textarea th:name="'dayItineraries[' + ${day.key} + ']'" rows="4"
                                class="form-control w-full" th:text="${day.value}"></textarea>
                        </div>
                    </div>

                    <div class="mt-6 flex justify-center">
                        <button type="button" id="add-day"
                            class="bg-violet-700 hover:bg-violet-800 text-white px-5 py-2 rounded-lg transition-all duration-300 font-medium hover-glow">
                            <i class="fas fa-plus mr-2"></i> Add Another Day
                        </button>
                    </div>
                </div>

                <!-- Save button -->
                <div class="flex justify-end space-x-4">
                    <a th:href="@{/user/travel/myplans}"
                        class="px-6 py-3 border border-violet-600 text-violet-400 rounded-xl font-medium transition-all duration-300 hover:bg-violet-900 hover-glow">
                        Cancel
                    </a>
                    <button type="submit"
                        class="bg-violet-600 hover:bg-violet-700 px-6 py-3 rounded-xl font-medium transition-all duration-300 hover-glow">
                        <i class="fas fa-save mr-2"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        AOS.init({
            duration: 1000,
            once: true,
            offset: 100
        });

        // Initialize date pickers
        flatpickr("#startDate", {
            dateFormat: "Y-m-d",
            minDate: "today"
        });

        flatpickr("#endDate", {
            dateFormat: "Y-m-d",
            minDate: "today"
        });

        // Handle adding new days
        document.getElementById('add-day').addEventListener('click', function () {
            const daysContainer = document.getElementById('days-container');
            const existingDays = daysContainer.querySelectorAll('.day-card');

            // Find the highest day number
            let maxDay = 0;
            existingDays.forEach(day => {
                const dayText = day.querySelector('h3 span').textContent;
                const dayNum = parseInt(dayText);
                if (dayNum > maxDay) maxDay = dayNum;
            });

            const nextDay = maxDay + 1;

            // Create new day element
            const newDayElement = document.createElement('div');
            newDayElement.className = 'day-card glass-effect p-6 relative';
            newDayElement.innerHTML = `
                <h3 class="text-lg font-semibold mb-3">
                    Day <span>${nextDay}</span>
                </h3>
                <textarea name="dayItineraries[${nextDay}]" rows="4" 
                    class="form-control w-full" placeholder="What's on your agenda for Day ${nextDay}?"></textarea>
            `;

            daysContainer.appendChild(newDayElement);

            // Apply animation
            newDayElement.style.opacity = '0';
            newDayElement.style.transform = 'translateY(20px)';

            setTimeout(() => {
                newDayElement.style.transition = 'all 0.5s ease';
                newDayElement.style.opacity = '1';
                newDayElement.style.transform = 'translateY(0)';
            }, 50);
        });
    </script>
</body>

</html>
