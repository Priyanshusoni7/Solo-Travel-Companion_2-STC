<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Solo Travel Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <style>
        .text-gradient {
            background: linear-gradient(135deg, #a855f7 0%, #8b5cf6 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bg-gradient-glow {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.4) 0%, rgba(139, 92, 246, 0.4) 50%, rgba(99, 102, 241, 0.4) 100%);
        }

        .card-hover {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(139, 92, 246, 0.1), 0 10px 10px -5px rgba(139, 92, 246, 0.04);
        }

        .glass-morphism {
            background: rgba(15, 15, 26, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(139, 92, 246, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .hero-bg {
            background: radial-gradient(ellipse at top right, #4c1d95 0%, #1e1b4b 40%, #0f0f1a 90%);
            background-attachment: fixed;
        }

        .nav-pill {
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .nav-pill::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #a855f7, #6366f1);
            transition: width 0.3s ease;
            z-index: -1;
            border-radius: 9999px;
        }

        .nav-pill:hover::before {
            width: 100%;
        }

        .nav-pill.active::before {
            width: 100%;
        }

        .nav-pill:hover {
            color: white;
            border-color: transparent;
        }

        .badge-pulse {
            position: relative;
        }

        .badge-pulse::after {
            content: '';
            position: absolute;
            top: 50%;
            right: -5px;
            transform: translate(50%, -50%);
            width: 8px;
            height: 8px;
            background-color: #10B981;
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(16, 185, 129, 0.4);
            animation: pulse 2s infinite;
        }

        .message-bubble {
            position: relative;
            transition: all 0.3s ease;
        }

        .message-bubble::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 12px;
            height: 12px;
        }

        .message-bubble.outgoing::after {
            right: -6px;
            border-left: 12px solid #8B5CF6;
            border-bottom-left-radius: 50%;
            transform: rotate(45deg) translateY(6px);
        }

        .message-bubble.incoming::after {
            left: -6px;
            border-right: 12px solid #4338CA;
            border-bottom-right-radius: 50%;
            transform: rotate(-45deg) translateY(6px);
        }

        /* Animation for new messages */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .new-message {
            animation: fadeIn 0.3s ease forwards;
        }

        .bubble-animation {
            position: relative;
            overflow: hidden;
        }

        .bubble-animation::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            animation: bubbleMove 15s infinite linear;
        }

        @keyframes bubbleMove {
            0% {
                transform: translate(0, 0) rotate(0);
            }

            100% {
                transform: translate(5%, 10%) rotate(360deg);
            }
        }

        .hidden {
            display: none;
        }

        /* Scrollbar styling */
        .styled-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .styled-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 15, 26, 0.2);
            border-radius: 10px;
        }

        .styled-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.5);
            border-radius: 10px;
        }

        .styled-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.7);
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            margin: 0 1px;
            background-color: #8B5CF6;
            display: block;
            border-radius: 50%;
            opacity: 0.4;
        }

        .typing-indicator span:nth-of-type(1) {
            animation: 1s blink infinite 0.3333s;
        }

        .typing-indicator span:nth-of-type(2) {
            animation: 1s blink infinite 0.6666s;
        }

        .typing-indicator span:nth-of-type(3) {
            animation: 1s blink infinite 0.9999s;
        }

        @keyframes blink {
            50% {
                opacity: 1;
            }
        }
    </style>
</head>

<body class="hero-bg text-white min-h-screen flex flex-col mt-8">
    <!-- Include the navbar fragment with 'messages' as the active tab -->
    <div th:replace="~{fragments/loggedInNavbar:: main-navbar('messages')}"></div>

    <!-- Hidden element to store username -->
    <span th:text="${user.email}" id="user-email" class="hidden"></span>

    <!-- Chat Main Container -->
    <div class="container mx-auto px-4 mt-16 mb-8 flex-grow flex flex-col">
        <!-- Chat Area -->
        <div class="glass-morphism rounded-2xl overflow-hidden card-hover flex-grow flex flex-col" data-aos="fade-up"
            data-aos-duration="800">
            <!-- Chat Header -->
            <div class="p-3 border-b border-violet-900/30 flex justify-between items-center bg-black/30">
                <div class="flex items-center">
                    <h2 class="text-xl font-bold text-gradient">
                        <i class="fas fa-comments mr-2"></i>
                        Community
                    </h2>
                    <div class="ml-3 px-3 py-1 bg-violet-900/30 rounded-full text-xs text-violet-300 flex items-center">
                        <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span>
                        <span class="online-count">3 Online</span>
                    </div>
                </div>
                <button id="backButton"
                    class="px-4 py-2 rounded-lg bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-700 hover:to-indigo-700 text-white flex items-center transition-all duration-300">
                    <i class="fas fa-arrow-left mr-2"></i> Back
                </button>
            </div>

            <!-- Connection Status -->
            <div class="connecting bg-violet-600/20 text-center py-1 text-violet-300 flex items-center justify-center">
                <div class="typing-indicator mr-2">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                Connecting to chat...
            </div>

            <!-- Messages Area - Increased height -->
            <div class="flex-grow p-4 overflow-y-auto styled-scrollbar" id="message-container"
                style="max-height: 70vh;">
                <div id="load-more-container" class="flex justify-center mb-4 hidden">
                    <button id="loadMoreBtn" class="px-4 py-2 text-xs font-semibold rounded-full bg-violet-900/40 hover:bg-violet-900/60 text-violet-300 transition-all duration-300 flex items-center border border-violet-800/30">
                        <i class="fas fa-history mr-2"></i> Load older messages
                    </button>
                </div>
                <ul id="messageArea" class="space-y-4"></ul>
            </div>

            <!-- Message Input Form -->
            <form id="messageForm" name="messageForm" class="p-3 border-t border-violet-900/30 bg-black/30">
                <div class="flex items-center">
                    <div class="flex-grow relative">
                        <input type="text" id="message" placeholder="Type a message..." autocomplete="off"
                            class="w-full py-2 px-4 bg-gray-900/70 focus:bg-gray-900/90 text-white rounded-l-lg border-0 focus:ring-2 focus:ring-violet-500 outline-none transition-all duration-300" />
                        <button type="button"
                            class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-violet-400 transition-colors duration-300">
                            <i class="fas fa-smile"></i>
                        </button>
                    </div>
                    <button type="submit"
                        class="bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-700 hover:to-indigo-700 text-white px-5 py-2 rounded-r-lg flex items-center transition-all duration-300">
                        <i class="fas fa-paper-plane mr-2"></i>
                        Send
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Compact Footer -->
    <footer class="bg-black/80 backdrop-blur-sm text-white text-center py-4 mt-auto border-t border-violet-900/20">
        <div class="container mx-auto px-6">
            <div class="flex justify-between items-center">
                <div>
                    <a href="/" class="text-xl font-bold text-gradient">STC</a>
                    <span class="text-xs text-gray-400 ml-2">Connect. Explore. Experience.</span>
                </div>
                <div class="flex space-x-3">
                    <a href="#"
                        class="w-8 h-8 rounded-full bg-gray-800/50 flex items-center justify-center text-gray-400 hover:text-violet-400 hover:bg-gray-800 transition duration-300">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="#"
                        class="w-8 h-8 rounded-full bg-gray-800/50 flex items-center justify-center text-gray-400 hover:text-violet-400 hover:bg-gray-800 transition duration-300">
                        <i class="fab fa-twitter"></i>
                    </a>
                    <a href="#"
                        class="w-8 h-8 rounded-full bg-gray-800/50 flex items-center justify-center text-gray-400 hover:text-violet-400 hover:bg-gray-800 transition duration-300">
                        <i class="fab fa-instagram"></i>
                    </a>
                </div>
            </div>
            <p class="text-xs mt-2">&copy; 2025 Solo Travel Companion. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="/js/main.js"></script>
    <script>
        AOS.init({
            duration: 500,
            once: true
        });
    </script>
</body>

</html>
