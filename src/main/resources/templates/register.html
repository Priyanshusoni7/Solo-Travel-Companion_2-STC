<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Solo Travel Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #a855f7 0%, #8b5cf6 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-bg {
            background: radial-gradient(circle at top right, #4c1d95 0%, #1e1b4b 50%, #000 100%);
        }

        .hover-glow:hover {
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
        }

        .form-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
        }

        .tabs-underline {
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .tab-active {
            border-bottom: 2px solid #8b5cf6;
            color: #8b5cf6;
        }

        /* Progress bar animation */
        @keyframes progress {
            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }

        .progress-animation {
            animation: progress 2s ease-in-out;
        }

        .form-input option {
            background-color: #1f2937;
            /* Dark background */
            color: white;
            /* Light text */
        }
    </style>
</head>

<body class="bg-black text-white min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar-guest('register')}"></div>

    <!-- Registration Form -->
    <main class="hero-bg min-h-screen flex items-center justify-center px-4 py-32">
        <div class="glass-effect p-8 w-full max-w-2xl" data-aos="fade-up">
            <h2 class="text-3xl font-bold gradient-text mb-2 text-center">Join the Adventure</h2>
            <p class="text-gray-400 text-center mb-8">Create your account and connect with solo travelers worldwide</p>

            <!-- Progress Steps -->
            <div class="mb-8">
                <div class="flex justify-between tabs-underline">
                    <button class="step-tab py-2 px-4 tab-active" id="tab-1" onclick="showStep(1)">
                        <i class="fas fa-user-circle mr-2"></i>Basic Info
                    </button>
                    <button class="step-tab py-2 px-4" id="tab-2" onclick="showStep(2)">
                        <i class="fas fa-map-marker-alt mr-2"></i>Location
                    </button>
                    <button class="step-tab py-2 px-4" id="tab-3" onclick="showStep(3)">
                        <i class="fas fa-passport mr-2"></i>Profile
                    </button>
                </div>
                <div class="h-1 w-full bg-gray-800 mt-2">
                    <div class="h-1 bg-violet-600 progress-bar" style="width: 33%"></div>
                </div>
            </div>

            <form th:action="@{/register}" th:object="${registerUser}" method="post" class="space-y-6"
                enctype="multipart/form-data">
                <!-- Step 1: Basic Information -->
                <div class="step-content" id="step-1-content">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="name" class="block text-gray-300 mb-2">
                                <i class="fas fa-user mr-2"></i>Full Name
                            </label>
                            <input type="text" th:field="*{name}" id="name"
                                class="form-input w-full px-4 py-3 rounded-xl" placeholder="Enter your full name"
                                required>
                        </div>

                        <div>
                            <label for="email" class="block text-gray-300 mb-2">
                                <i class="fas fa-envelope mr-2"></i>Email Address
                            </label>
                            <input type="email" th:field="*{email}" id="email"
                                class="form-input w-full px-4 py-3 rounded-xl" placeholder="your.email@example.com"
                                required>
                        </div>

                        <div>
                            <label for="password" class="block text-gray-300 mb-2">
                                <i class="fas fa-lock mr-2"></i>Password
                            </label>
                            <input type="password" th:field="*{password}" id="password"
                                class="form-input w-full px-4 py-3 rounded-xl" placeholder="Create a strong password"
                                required>
                        </div>

                        <div>
                            <label for="phoneNumber" class="block text-gray-300 mb-2">
                                <i class="fas fa-phone mr-2"></i>Phone Number
                            </label>
                            <input type="tel" th:field="*{phoneNumber}" id="phoneNumber"
                                class="form-input w-full px-4 py-3 rounded-xl" placeholder="Your phone number" required>
                        </div>
                    </div>

                    <div class="mt-8 flex justify-end">
                        <button type="button" onclick="nextStep(2)"
                            class="bg-violet-600 hover:bg-violet-700 px-6 py-3 rounded-xl font-medium transition-all duration-300 hover-glow">
                            Next <i class="fas fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </div>

                <!-- Step 2: Location Information -->
                <div class="step-content hidden" id="step-2-content">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="country" class="block text-gray-300 mb-2">
                                <i class="fas fa-globe mr-2"></i>Country
                            </label>
                            <select th:field="*{country}" id="country" class="form-input w-full px-4 py-3 rounded-xl"
                                required>
                                <option value="">Select Your Country</option>
                                <option value="US">United States</option>
                                <option value="CA">Canada</option>
                                <option value="UK">United Kingdom</option>
                                <option value="AU">Australia</option>
                                <option value="IN">India</option>
                                <option value="JP">Japan</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>

                        <div>
                            <label for="state" class="block text-gray-300 mb-2">
                                <i class="fas fa-map mr-2"></i>State/Province
                            </label>
                            <input type="text" th:field="*{state}" id="state"
                                class="form-input w-full px-4 py-3 rounded-xl" placeholder="Your state or province">
                        </div>

                        <div>
                            <label for="city" class="block text-gray-300 mb-2">
                                <i class="fas fa-city mr-2"></i>City
                            </label>
                            <input type="text" th:field="*{city}" id="city"
                                class="form-input w-full px-4 py-3 rounded-xl" placeholder="Your city">
                        </div>

                        <div>
                            <label for="language" class="block text-gray-300 mb-2">
                                <i class="fas fa-language mr-2"></i>Primary Language
                            </label>
                            <select th:field="*{language}" id="language" class="form-input w-full px-4 py-3 rounded-xl"
                                required>
                                <option value="">Select Your Language</option>
                                <option value="English">Gujarati</option>
                                <option value="Hindi">Hindi</option>
                                <option value="English">English</option>
                                <option value="Spanish">Spanish</option>
                                <option value="French">French</option>
                                <option value="German">German</option>
                                <option value="Mandarin">Mandarin</option>
                                <option value="Japanese">Japanese</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-8 flex justify-between">
                        <button type="button" onclick="previousStep(1)"
                            class="bg-gray-700 hover:bg-gray-600 px-6 py-3 rounded-xl font-medium transition-all duration-300">
                            <i class="fas fa-arrow-left mr-2"></i> Back
                        </button>
                        <button type="button" onclick="nextStep(3)"
                            class="bg-violet-600 hover:bg-violet-700 px-6 py-3 rounded-xl font-medium transition-all duration-300 hover-glow">
                            Next <i class="fas fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </div>

                <!-- Step 3: Profile Information -->
                <div class="step-content hidden" id="step-3-content">
                    <div class="space-y-6">
                        <!-- image upload and preview -->
                        <div>
                            <label for="profilePic" class="block text-gray-300 mb-2">
                                <i class="fas fa-camera mr-2"></i>Profile Picture
                            </label>
                            <div class="flex items-center space-x-4">
                                <div class="relative w-24 h-24 rounded-full bg-violet-600/20 flex items-center justify-center overflow-hidden"
                                    id="imagePreview">
                                    <i class="fas fa-user text-3xl text-violet-300"></i>
                                </div>
                                <div class="flex-1">
                                    <input type="file" th:field="*{profilePic}" id="profilePic" name="profilePic"
                                        accept="image/*" class="hidden" onchange="previewImage(this)">
                                    <label for="profilePic"
                                        class="cursor-pointer bg-violet-600/20 hover:bg-violet-600/30 px-4 py-2 rounded-xl flex items-center justify-center gap-2 transition-all duration-300">
                                        <i class="fas fa-upload"></i>
                                        Choose Photo
                                    </label>
                                    <p class="text-xs text-gray-400 mt-2">Maximum size: 5MB. Supported formats: JPG, PNG
                                    </p>
                                </div>
                            </div>
                        </div>
                        <!-- Gender field -->
                        <div>
                            <label for="gender" class="block text-gray-300 mb-2">
                                <i class="fas fa-venus-mars mr-2"></i>Gender
                            </label>
                            <select th:field="*{gender}" id="gender" class="form-input w-full px-4 py-3 rounded-xl">
                                <option value="">Prefer not to say</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Non-binary">Non-binary</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <!-- about field -->
                        <div>
                            <label for="about" class="block text-gray-300 mb-2">
                                <i class="fas fa-comment-alt mr-2"></i>About You
                            </label>
                            <textarea th:field="*{about}" id="about" class="form-input w-full px-4 py-3 rounded-xl h-32"
                                placeholder="Tell us about yourself and your travel interests..." required></textarea>
                            <p class="text-xs text-gray-400 mt-2">Share your travel experiences, interests, and what
                                kind of travel companions you're looking to connect with.</p>
                        </div>

                        <div class="flex items-center space-x-2">
                            <input type="checkbox" id="terms"
                                class="w-4 h-4 bg-transparent border border-violet-400 rounded" required>
                            <label for="terms" class="text-gray-300 text-sm">
                                I agree to the <a href="/terms" class="text-violet-400 hover:text-violet-300">Terms of
                                    Service</a> and <a href="/privacy"
                                    class="text-violet-400 hover:text-violet-300">Privacy Policy</a>
                            </label>
                        </div>
                    </div>

                    <div class="mt-8 flex justify-between">
                        <button type="button" onclick="previousStep(2)"
                            class="bg-gray-700 hover:bg-gray-600 px-6 py-3 rounded-xl font-medium transition-all duration-300">
                            <i class="fas fa-arrow-left mr-2"></i> Back
                        </button>
                        <button type="submit"
                            class="bg-violet-600 hover:bg-violet-700 px-6 py-3 rounded-xl font-medium transition-all duration-300 hover-glow">
                            <i class="fas fa-user-plus mr-2"></i> Create Account
                        </button>
                    </div>
                </div>
            </form>

            <div class="flex flex-col md:flex-row justify-between items-center mt-10 pt-6 border-t border-gray-800">
                <p class="text-gray-400 text-center md:text-left mb-4 md:mb-0">
                    Already have an account?
                    <a href="/login" class="text-violet-400 hover:text-violet-300">Login here</a>
                </p>
                <div class="flex space-x-4">
                    <a href="#" class="text-gray-400 hover:text-violet-400 transition-colors">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="#" class="text-gray-400 hover:text-violet-400 transition-colors">
                        <i class="fab fa-twitter"></i>
                    </a>
                    <a href="#" class="text-gray-400 hover:text-violet-400 transition-colors">
                        <i class="fab fa-instagram"></i>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        AOS.init({
            duration: 1000,
            once: true,
            offset: 100
        });

        let currentStep = 1;

        function showStep(step) {
            // Hide all steps
            document.querySelectorAll('.step-content').forEach(content => {
                content.classList.add('hidden');
            });

            // Show current step
            document.getElementById(`step-${step}-content`).classList.remove('hidden');

            // Update tabs
            document.querySelectorAll('.step-tab').forEach(tab => {
                tab.classList.remove('tab-active');
            });
            document.getElementById(`tab-${step}`).classList.add('tab-active');

            // Update progress bar
            const progressBar = document.querySelector('.progress-bar');
            progressBar.style.width = `${33 * step}%`;
            progressBar.classList.add('progress-animation');

            currentStep = step;
        }

        function nextStep(step) {
            showStep(step);
        }

        function previousStep(step) {
            showStep(step);
        }

        // Country-dependent state dropdown (simplified example)
        // Dynamic state placeholder based on country selection
        document.getElementById('country').addEventListener('change', function () {
            const country = this.value;
            const stateField = document.getElementById('state');

            // Clear current state value
            stateField.value = '';

            if (country) {
                // Get the selected country text from the dropdown
                const selectedCountryText = this.options[this.selectedIndex].text;
                stateField.placeholder = `Select a ${selectedCountryText} state/province`;
            } else {
                // Default placeholder if no country is selected
                stateField.placeholder = "Your state or province";
            }
        });

        function previewImage(input) {
            const preview = document.getElementById('imagePreview');
            const file = input.files[0];

            if (file) {
                // Check file size (5MB max)
                if (file.size > 5 * 1024 * 1024) {
                    alert('File size must be less than 5MB');
                    input.value = '';
                    return;
                }

                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
                }
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = '<i class="fas fa-user text-3xl text-violet-300"></i>';
            }
        }
    </script>
</body>

</html>
