spring.application.name=stc

#  when you want to run the project in local ( without docker )
# spring.profiles.active=dev


# ==============================
# Server
# ==============================
server.port=${PORT:8080}


# ==============================
# Database
# ==============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==============================
# Uploads (profile pictures, package images)
# ==============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ==============================
# Roles
# ==============================
# Comma separated e-mails of already-registered users to promote to ADMIN on startup.
# Only promotes; removing an e-mail does not demote (use the admin panel for that).
app.admin.emails=${APP_ADMIN_EMAILS:}

# ==============================
# Travel plans
# ==============================
# Time zone that decides when a trip's start date is "reached" (auto-close) and which trips have ended
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# ==============================
# Frontend integration (React app runs on its own origin)
# ==============================
# Comma separated origins of the React app, e.g. https://stc-frontend.example.com
# Patterns like https://*.vercel.app are allowed. Default = local Vite dev server.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Session cookie. Defaults work when frontend and API share a site (localhost:5173 -> localhost:8080,
# or app.example.com -> api.example.com). If they are on DIFFERENT sites (e.g. *.vercel.app ->
# *.onrender.com) set SESSION_COOKIE_SAME_SITE=none and SESSION_COOKIE_SECURE=true (HTTPS only).
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true

# ==============================
# Cloudinary
# ==============================
cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}

# ==============================
# Redis
# ==============================

# local redis server 
# spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
# spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# for depployment 
spring.data.redis.url=${SPRING_DATA_REDIS_URL}